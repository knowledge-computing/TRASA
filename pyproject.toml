[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trasa"
version = "0.2.0"
description = "Dual-mask-guided transformer road graph extraction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch==2.5.1", "torchvision==0.20.1", "numpy==2.2.6", "scipy==1.15.3", "Pillow==12.0.0", "PyYAML==6.0.3", "shapely==2.1.2"]

[project.urls]
Repository = "https://github.com/knowledge-computing/TRASA"

[project.optional-dependencies]
test = ["pytest==9.0.2"]
data = ["vtk==9.3.1"]
baselines = ["scikit-image==0.25.2"]
gis = ["pyproj==3.7.1", "fiona==1.10.1", "rasterio==1.4.3", "affine==2.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"trasa.vendor" = ["*LICENSE*"]
"trasa.vendor.ldtr" = ["LICENSE*"]
"trasa.vendor.segment_anything" = ["LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
